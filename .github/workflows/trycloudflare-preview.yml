name: TryCloudflare PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 2. Fix Case Sensitivity
      - name: Fix Case Sensitivity
        run: |
          ln -s Game server/game || true

      # 3. Safe Fallback Patch
      # This completely clears out the extra background servers and enforces single-port 
      # mode on the main server to ensure players bypass socket errors on Cloudflare.
      - name: Enforce Single Port Architecture
        run: |
          echo "=== Optimizing server configs for cloud runner ==="
          # Trims out the secondary port entries so your framework routes all rooms through port 3000
          find . -type f -name "config.js" -o -name "config.json" | xargs sed -i 's/servers: \[/servers: \[\n        {\n            share_client_server: true,\n            host: "localhost:3000",\n            port: 3000,\n            id: "la",\n            region: "Local",\n            gamemode: ["tdm"],\n            player_cap: 80\n        }/g' 2>/dev/null || true
          # Safely truncates multi-server configurations to prevent initialization runtime loops
          find . -type f -name "config.js" -o -name "config.json" | xargs sed -i '/host: '\''localhost:3001'\''/,/}\s*,\s*\]/d' 2>/dev/null || true

      # 4. Install dependencies and start your Node game server
      - name: Start Game Server
        run: |
          npm install
          npm start > server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 6

      # 5. Setup cloudflared CLI
      - name: Setup cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      # 6. Start TryCloudflare Tunnel (Clean zero-config deployment)
      - name: Start TryCloudflare Tunnel
        id: start_tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:3000 > cloudflared.log 2>&1 &
          echo "TUNNEL_PID=$!" >> $GITHUB_ENV
          
          sleep 6
          echo "=== CLOUDFLARE TUNNEL LOGS ==="
          cat cloudflared.log
          
          echo "=== GAME SERVER STARTUP LOGS ==="
          cat server.log
          
          TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
          echo "Extracted URL: $TUNNEL_URL"
          echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      # 7. Comment on PR
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 **Cloudflare Secure Arena Preview Live!**
            Your optimized multi-addon server is fully operational here: ${{ steps.start_tunnel.outputs.tunnel_url }}
          comment_tag: 'trycloudflare-preview'

      # 8. Keep alive for testing
      - name: Keep Alive for Testing
        run: |
          echo "Tunnel is active at: ${{ steps.start_tunnel.outputs.tunnel_url }}"
          sleep 1800 

      - name: Stop Services
        if: always()
        run: |
          kill ${{ env.TUNNEL_PID }} || true
          kill ${{ env.SERVER_PID }} || true
