name: TryCloudflare PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 2. Fix Case Sensitivity
      - name: Fix Case Sensitivity
        run: |
          ln -s Game server/game || true

      # 3. Install dependencies and start your Node game server
      - name: Start Game Server
        run: |
          npm install
          npm start > server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 6 # Give the heavily modded game extra time to compile and load all 21 groups

      # 4. Setup cloudflared CLI
      - name: Setup cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      # 5. Build dynamic multi-port Tunnel config to stop socket errors
      # This handles standard web traffic on 3000 and websocket paths seamlessly
      name: Create Cloudflared Configuration
        run: |
          mkdir -p ~/.cloudflared
          cat << 'EOF' > ~/.cloudflared/config.yml
          ingress:
            - hostname: "*.trycloudflare.com"
              path: "^/(ws|socket|play)"
              service: http://127.0.0.1:3000
          EOF
          echo "Cloudflared ingress configurations generated successfully."

      # 6. Start TryCloudflare Tunnel using the unified config mapping
      - name: Start TryCloudflare Tunnel
        id: start_tunnel
        run: |
          cloudflared tunnel --config ~/.cloudflared/config.yml run-quick > cloudflared.log 2>&1 &
          echo "TUNNEL_PID=$!" >> $GITHUB_ENV
          
          sleep 6
          echo "=== CLOUDFLARE TUNNEL LOGS ==="
          cat cloudflared.log
          
          echo "=== GAME SERVER STARTUP LOGS ==="
          cat server.log
          
          TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
          echo "Extracted URL: $TUNNEL_URL"
          echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      # 7. Comment on PR
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 **Cloudflare Unified Game Server Live!**
            Your game and sockets are fully accessible here: ${{ steps.start_tunnel.outputs.tunnel_url }}
          comment_tag: 'trycloudflare-preview'

      # 8. Keep alive for testing
      - name: Keep Alive for Testing
        run: |
          echo "Tunnel is active at: ${{ steps.start_tunnel.outputs.tunnel_url }}"
          sleep 1800 

      - name: Stop Services
        if: always()
        run: |
          kill ${{ env.TUNNEL_PID }} || true
          kill ${{ env.SERVER_PID }} || true
