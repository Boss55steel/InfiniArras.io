name: TryCloudflare PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main] # Allows you to test it on main, but won't crash on the comment step

permissions:
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 2. Install dependencies and start your actual Node game server
      # (Adjust 'npm start' or 'node index.js' depending on your package.json script)
      # Replace 8080 with the actual port your InfiniArras server listens on (e.g., 3000, 8000)
      name: Start Game Server
        run: |
          npm install
          npm start &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 3 # Give the Node server a moment to boot up

      # 3. Setup cloudflared CLI
      - name: Setup cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      # 4. Start TryCloudflare Tunnel (pointing to your Node server's port)
      - name: Start TryCloudflare Tunnel
        id: start_tunnel
        run: |
          # Change 8080 to match your game's port if it uses something else (like 3000)
          cloudflared tunnel --url http://localhost:8080 > cloudflared.log 2>&1 &
          echo "TUNNEL_PID=$!" >> $GITHUB_ENV
          
          sleep 5
          cat cloudflared.log
          
          TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
          echo "Extracted URL: $TUNNEL_URL"
          echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      # 5. Only comment if this is an actual Pull Request
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 **Cloudflare Quick Tunnel Preview Live!**
            Your game preview is accessible here: ${{ steps.start_tunnel.outputs.tunnel_url }}
          comment_tag: 'trycloudflare-preview'

      # 6. Keep alive for testing
      - name: Keep Alive for Testing
        run: |
          echo "Tunnel is active at: ${{ steps.start_tunnel.outputs.tunnel_url }}"
          sleep 300 

      - name: Stop Services
        if: always()
        run: |
          kill ${{ env.TUNNEL_PID }} || true
          kill ${{ env.SERVER_PID }} || true
