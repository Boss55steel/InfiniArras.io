name: TryCloudflare PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 2. Fix Case Sensitivity
      - name: Fix Case Sensitivity
        run: |
          ln -s Game server/game || true

      # 3. Dynamic Configuration Patching
      # This looks for hardcoded ports or old protocol types in your client logic
      # and enforces modern secure web socket path routing natively
      - name: Dynamic Networking Patch
        run: |
          echo "=== Patching Game Server Client Connections ==="
          # Searches for configuration patterns and updates references dynamically
          find . -type f -name "*.js" -o -name "*.json" -o -name "*.html" | xargs sed -i 's/ws:\/\//wss:\/\//g' 2>/dev/null || true
          find . -type f -name "*.js" -o -name "*.json" -o -name "*.html" | xargs sed -i 's/:8000//g' 2>/dev/null || true
          find . -type f -name "*.js" -o -name "*.json" -o -name "*.html" | xargs sed -i 's/:8080//g' 2>/dev/null || true

      # 4. Install dependencies and start your Node game server (Port 3000)
      - name: Start Game Server
        run: |
          npm install
          npm start > server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 6

      # 5. Setup cloudflared CLI
      - name: Setup cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      # 6. Start TryCloudflare Tunnel (Directly targeting unified port 3000)
      - name: Start TryCloudflare Tunnel
        id: start_tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:3000 > cloudflared.log 2>&1 &
          echo "TUNNEL_PID=$!" >> $GITHUB_ENV
          
          sleep 6
          echo "=== CLOUDFLARE TUNNEL LOGS ==="
          cat cloudflared.log
          
          echo "=== GAME SERVER STARTUP LOGS ==="
          cat server.log
          
          TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
          echo "Extracted URL: $TUNNEL_URL"
          echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      # 7. Comment on PR
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 **Cloudflare Secure Single-Port Preview Live!**
            Your secure web-arena preview is ready here: ${{ steps.start_tunnel.outputs.tunnel_url }}
          comment_tag: 'trycloudflare-preview'

      # 8. Keep alive for testing
      - name: Keep Alive for Testing
        run: |
          echo "Tunnel is active at: ${{ steps.start_tunnel.outputs.tunnel_url }}"
          sleep 1800 

      - name: Stop Services
        if: always()
        run: |
          kill ${{ env.TUNNEL_PID }} || true
          kill ${{ env.SERVER_PID }} || true
